<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe082" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#d4af37" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#aa7c11" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5b8"/>
      <stop offset="25%" stop-color="#ffd56b"/>
      <stop offset="60%" stop-color="#c99a2c"/>
      <stop offset="100%" stop-color="#8c6510"/>
    </linearGradient>
    <filter id="goldBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="500" height="500" fill="#08070d"/>
  <circle cx="250" cy="250" r="230" fill="url(#goldGlow)"/>
  
  <!-- Outer Sacred Yah'adamiya Astrological / Geometric Rings -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.6"/>
  <circle cx="250" cy="250" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#goldBloom)"/>
  <circle cx="250" cy="250" r="145" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#goldBloom)"/>
  
  <!-- Rotating Orbit Markers & Nodes -->
  <!-- Top Node -->
  <g transform="translate(250, 40)">
    <rect x="-14" y="-12" width="28" height="24" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffe082"/>
  </g>
  <!-- Top Right Nodes -->
  <g transform="translate(370, 90)">
    <line x1="-15" y1="0" x2="15" y2="0" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="-18" r="3" fill="#ffe082"/>
  </g>
  <!-- Right Node -->
  <g transform="translate(440, 250)">
    <rect x="-12" y="-18" width="24" height="36" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="url(#goldGrad)" stroke-width="2"/>
  </g>
  <!-- Bottom Right Node -->
  <g transform="translate(370, 410)">
    <polyline points="-12,-12 12,-12 12,12 -12,12" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="3" fill="#ffe082"/>
  </g>
  <!-- Bottom Node -->
  <g transform="translate(250, 455)">
    <line x1="-18" y1="0" x2="18" y2="0" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <line x1="0" y1="-15" x2="0" y2="15" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="20" r="3" fill="#ffe082"/>
  </g>
  <!-- Bottom Left Node -->
  <g transform="translate(130, 410)">
    <polyline points="15,-10 -15,-10 -15,15" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  </g>
  <!-- Left Node (S-glyph shape) -->
  <g transform="translate(60, 250)">
    <line x1="-14" y1="-12" x2="14" y2="-12" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <path d="M -14 -12 C 10 -4, 10 8, -6 14 C -14 18, 5 24, 12 24" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  </g>
  <!-- Top Left Node -->
  <g transform="translate(130, 90)">
    <rect x="-12" y="-12" width="24" height="24" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffe082"/>
  </g>

  <!-- Circular Glyphs Ring Constellation Dots -->
  <circle cx="310" cy="72" r="3.5" fill="#ffd56b"/>
  <circle cx="410" cy="170" r="3.5" fill="#ffd56b"/>
  <circle cx="415" cy="330" r="3.5" fill="#ffd56b"/>
  <circle cx="310" cy="428" r="3.5" fill="#ffd56b"/>
  <circle cx="190" cy="428" r="3.5" fill="#ffd56b"/>
  <circle cx="85" cy="330" r="3.5" fill="#ffd56b"/>
  <circle cx="90" cy="170" r="3.5" fill="#ffd56b"/>
  <circle cx="190" cy="72" r="3.5" fill="#ffd56b"/>

  <!-- Center Emblem Calligraphy -->
  <text x="250" y="222" text-anchor="middle" font-family="'Amiri', 'Tajawal', serif" font-size="52" font-weight="bold" fill="url(#goldGrad)" filter="url(#goldBloom)">شَفْرَة</text>
  <text x="250" y="295" text-anchor="middle" font-family="'Amiri', 'Tajawal', serif" font-size="56" font-weight="900" fill="url(#goldGrad)" filter="url(#goldBloom)">اليَحَادَمِيّة</text>
</svg>
